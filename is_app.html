<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1420">
<title>مقرر نظم المعلومات</title>
<style>
:root{
  --bg:#0f1420; --card:#161d2e; --card2:#1c2438; --line:#2a3450; --text:#e9edf5; --sub:#9aa5b8;
  --c1:#3b82f6; --c2:#8b5cf6; --c4:#f59e0b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Tahoma","Segoe UI",sans-serif;line-height:1.7;user-select:none}
input,textarea{user-select:text}
.screen{display:none;min-height:100%}
.screen.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== HOME ===== */
#home{padding:0}
.home-header{padding:22px 18px 16px;background:linear-gradient(135deg,#1a2340,#151b2e);border-bottom:1px solid var(--line)}
.home-header h1{margin:0;font-size:1.3rem}
.home-header p{margin:6px 0 0;color:var(--sub);font-size:.85rem}
.lec-list{padding:14px}
.lec-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer}
.lec-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:0 0 auto}
.lec-info b{display:block;font-size:.95rem}
.lec-info span{color:var(--sub);font-size:.78rem}
.lec-arrow{margin-inline-start:auto;color:var(--sub)}
.install-tip{margin:14px;padding:14px;background:var(--card2);border:1px dashed var(--line);border-radius:14px;font-size:.8rem;color:var(--sub)}
.install-tip b{color:var(--text)}

/* ===== COURSE SCREEN ===== */
.top{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:10;background:#101627;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.back{background:var(--card2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:1rem;cursor:pointer}
.top b{font-size:.95rem}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#101627;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:9}
nav.tabs button{flex:0 0 auto;background:var(--card2);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-size:.83rem;cursor:pointer;white-space:nowrap}
nav.tabs button.active{color:#fff}
main.content{max-width:820px;margin:0 auto;padding:16px;padding-bottom:60px}
.tabpane{display:none}
.tabpane.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.acc-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.acc-head b{font-size:.93rem}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-body p{color:var(--sub);font-size:.87rem;margin:10px 0 0}
.acc-body ul{margin:10px 0 0;padding-inline-start:18px;color:var(--sub);font-size:.85rem}
.chev{transition:transform .3s}
.open .chev{transform:rotate(180deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.flash{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:.88rem}
.flash .front{font-weight:bold}
.flash .back{display:none;color:var(--sub);font-size:.82rem}
.flash.flip .front{display:none}
.flash.flip .back{display:block}
.qwrap{margin-bottom:16px}
.qwrap h4{font-size:.9rem;margin:0 0 10px}
.opt{display:block;width:100%;text-align:right;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:.84rem}
.opt.correct{border-color:#10b981;background:#0f2a22}
.opt.wrong{border-color:#ef4444;background:#2a1414}
.opt[disabled]{cursor:default}
.btn{border:none;padding:10px 20px;border-radius:10px;font-size:.88rem;cursor:pointer;color:#fff;font-weight:bold}
.score-box{text-align:center;padding:20px}
.score-num{font-size:2.2rem;font-weight:bold}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-size:.7rem;color:var(--sub);margin-inline-end:6px;margin-bottom:6px}
.take{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line);background:var(--card2)}
@media (prefers-color-scheme: light){
  :root:not([data-theme="light"]){--bg:#f4f6fb;--card:#fff;--card2:#eef1f8;--text:#1a2036;--sub:#5b6478;--line:#dfe4f0}
}
</style>
</head>
<body>

<!-- ============ HOME SCREEN ============ -->
<div class="screen active" id="home">
  <div class="home-header">

    <p>تطبيقك الشخصي للمراجعة — يعمل بدون إنترنت</p>

  <div class="install-tip">

    آيفون: افتح الملف في Safari ← زر المشاركة ← "إضافة إلى الشاشة الرئيسية"<br>
    أندرويد: افتح الملف في Chrome ← القائمة (⋮) ← "إضافة إلى الشاشة الرئيسية"

</div>

<!-- ============ COURSE SCREEN TEMPLATE (shared) ============ -->
<div class="screen" id="course">
  <div class="top">
    <button class="back" onclick="goHome()">→</button>
    <b id="courseTitle"></b>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="explain" class="active">الشرح</button>
    <button data-t="glossary">المصطلحات</button>
    <button data-t="quiz">الاختبار</button>
    <button data-t="summary">الملخص</button>
  </nav>
  <main class="content">
    <div class="tabpane active" id="pane-explain"></div>

    <div class="tabpane" id="pane-quiz"><div id="quizArea"></div></div>
    <div class="tabpane" id="pane-summary"></div>
  </main>
</div>

    {q:"ترتيب دورة الاستجابة للحوادث؟",o:["Recover→Detect→Prepare","Prepare→Detect→Contain→Recover→Learn","Contain→Prepare→Learn","Learn→Prepare→Detect"],a:1},
    {q:"ماذا تحدد حقوق القرار في الحوكمة؟",o:["نوع الخط","من يوافق على قبول الخطر أو إطلاق خدمة","سرعة الإنترنت","عدد الموظفين"],a:1},
    {q:"في السحابة، من يبقى مسؤولاً عن الهوية والبيانات؟",o:["المزود فقط","العميل (المؤسسة)","لا أحد","شركة التأمين"],a:1},
    {q:"من يتحمل المساءلة عن أثر الذكاء الاصطناعي؟",o:["الأداة نفسها","المؤسسة والإنسان","المستخدم فقط","لا أحد"],a:1}
  ],
  takeaways:["عرّف القيمة والخطر قبل اختيار الضابط","اربط الهوية والوصول بالغرض والخدمة","اجعل الحوكمة والخصوصية قابلة للتشغيل","صمّم المرونة والتعلم قبل الحادث"],
  tags:["Risk","CIA","Zero Trust","IAM","Incident Response","Privacy","AI Governance"],
  next:"مواءمة نظم المعلومات مع الأهداف الاستراتيجية، وإدارة التحول الرقمي في محفظة مبادرات متكاملة."
};

const COURSES = [L1, L4];
let current = null;

/* ---------- HOME ---------- */
function renderHome(){
  document.getElementById('lecList').innerHTML = COURSES.map(c=>`
    <div class="lec-card" onclick="openCourse('${c.id}')">
      <div class="lec-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
      <div class="lec-info"><b>${c.title}</b><span>${c.sub}</span></div>
      <div class="lec-arrow">‹</div>
    </div>`).join('');
}
function goHome(){
  document.getElementById('course').classList.remove('active');
  document.getElementById('home').classList.add('active');
}
function openCourse(id){
  current = COURSES.find(c=>c.id===id);
  document.getElementById('courseTitle').textContent = current.title;
  document.querySelectorAll('nav.tabs button').forEach(b=>{b.style.background=''; b.classList.remove('active');});
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  document.querySelector('[data-t="explain"]').classList.add('active');
  document.getElementById('pane-explain').classList.add('active');
  renderExplain(); renderGlossary(); renderQuiz(); renderSummary();
  document.getElementById('home').classList.remove('active');
  document.getElementById('course').classList.add('active');
  document.getElementById('course').scrollTop = 0;
  document.querySelectorAll('nav.tabs button.active').forEach(b=>b.style.background=current.color);
}

/* ---------- TABS ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>{x.classList.remove('active'); x.style.background='';});
    document.querySelectorAll('.tabpane').forEach(s=>s.classList.remove('active'));
    b.classList.add('active'); b.style.background = current.color;
    document.getElementById('pane-'+b.dataset.t).classList.add('active');
  };
});

/* ---------- EXPLAIN ---------- */
function renderExplain(){
  document.getElementById('pane-explain').innerHTML = current.topics.map((t,i)=>`
    <div class="card acc" id="acc${i}">
      <div class="acc-head" onclick="toggleAcc(${i})"><b>${t[0]} — ${t[1]}</b><span class="chev">▾</span></div>
      <div class="acc-body" id="accb${i}"><p>${t[2]}</p>${t[3].length?`<ul>${t[3].map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>
    </div>`).join('');
}
function toggleAcc(i){
  const card = document.getElementById('acc'+i), body = document.getElementById('accb'+i);
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.acc.open').forEach(c=>{c.classList.remove('open'); c.querySelector('.acc-body').style.maxHeight=null;});
  if(!isOpen){ card.classList.add('open'); body.style.maxHeight = body.scrollHeight+'px'; }
}

/* ---------- GLOSSARY ---------- */
function renderGlossary(){
  document.getElementById('flashGrid').innerHTML = current.glossary.map(g=>`
    <div class="flash" onclick="this.classList.toggle('flip')"><div class="front">${current.icon} ${g[0]}</div><div class="back">${g[1]}</div></div>`).join('');
}

/* ---------- QUIZ ---------- */
let userAnswers = [];
function renderQuiz(){
  userAnswers = new Array(current.quiz.length).fill(null);
  document.getElementById('quizArea').innerHTML = current.quiz.map((q,i)=>`
    <div class="card qwrap" id="qw${i}"><h4>${i+1}. ${q.q}</h4>
      ${q.o.map((op,j)=>`<button class="opt" onclick="answer(${i},${j})">${op}</button>`).join('')}
    </div>`).join('') + `<div style="text-align:center;margin-top:10px"><button class="btn" style="background:${current.color}" onclick="showScore()">عرض النتيجة</button></div>`;
}
function answer(qi,oi){
  if(userAnswers[qi]!==null) return;
  userAnswers[qi]=oi;
  const wrap = document.getElementById('qw'+qi);
  wrap.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===current.quiz[qi].a) b.classList.add('correct');
    else if(j===oi) b.classList.add('wrong');
  });
}
function showScore(){
  const total = current.quiz.length;
  const correct = userAnswers.reduce((s,a,i)=> s + (a===current.quiz[i].a?1:0), 0);
  const key = 'is_'+current.id+'_best';
  let best = 0;
  try{ best = parseInt(localStorage.getItem(key)||'0'); }catch(e){}
  if(correct>best){ try{ localStorage.setItem(key, correct); }catch(e){} best=correct; }
  document.getElementById('quizArea').innerHTML = `<div class="card score-box">
    <div class="score-num" style="color:${current.color}">${correct} / ${total}</div>
    <p>أفضل نتيجة على هذا الجهاز: <b>${best} / ${total}</b></p>
    <button class="btn" style="background:${current.color}" onclick="renderQuiz()">إعادة المحاولة</button>
  </div>`;
}

/* ---------- SUMMARY ---------- */
function renderSummary(){
  document.getElementById('pane-summary').innerHTML =
    current.takeaways.map((t,i)=>`<div class="take" style="border-color:${current.color}55"><b style="color:${current.color}">${String(i+1).padStart(2,'0')} · ${t}</b></div>`).join('') +
    `<div class="card"><b>وسوم المحاضرة</b><br><br>${current.tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
     <div class="card"><b>المحاضرة القادمة</b><p style="color:var(--sub);margin:8px 0 0">${current.next}</p></div>`;
}

renderHome();
</script>
</body>
</html>
